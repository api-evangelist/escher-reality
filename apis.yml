name: Escher Reality
description: >-
  Escher Reality was an augmented reality and computer vision startup founded in 2016 by Ross Finman
  (CEO) and Diana Hu (CTO), with roots in the MIT Sandbox program. It built cloud backend services for
  cross-platform, persistent, multi-user mobile AR — shared experiences that neither Apple ARKit nor
  Google ARCore offered at the time — letting multiple users interact with the same virtual objects
  anchored to the real world. The company raised roughly $3 million and was based in Sunnyvale,
  California. In February 2018 Escher Reality was acquired by Niantic (creator of Pokemon GO); its team
  and technology were folded into the Niantic Real World Platform (now Lightship), and the standalone
  company and its developer/SDK offering were discontinued. This API Evangelist profile is retained as a
  historical record; there is no independent, active API or developer surface to enrich.
